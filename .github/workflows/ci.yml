name: CI (DISABLED - Manual only)

on:
   push:
     branches:
       - '**'  # Tous les push sur toutes les branches
  # pull_request:
  #   branches:
  #     - main
  #     - DEV
  #schedule:
    # Backup automatique tous les jours à 2h du matin UTC
   # - cron: '0 2 * * *'
  workflow_dispatch:  # Permet le lancement manuel UNIQUEMENT

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests + coverage)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crypto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crypto_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crypto_test?schema=public
      JWT_SECRET: test_jwt_secret
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install (backend)
        working-directory: backend
        run: npm ci

      - name: Unit tests + coverage (backend)
        working-directory: backend
        env:
          FIREBASE_DISABLED: "true"
        run: npm run test:coverage

      - name: Prepare integration DB schema (backend)
        working-directory: backend
        run: npm run test:integration:prepare

      - name: Integration tests + coverage (backend)
        working-directory: backend
        env:
          FIREBASE_DISABLED: "true"
        run: npm run test:integration:coverage

      - name: Upload backend coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage/**
            backend/coverage-integration/**

  frontend:
    name: Frontend (tests + coverage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (frontend)
        working-directory: frontend
        run: npm ci

      - name: Lint (frontend)
        working-directory: frontend
        run: npm run lint

      - name: Unit tests + coverage (frontend)
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload frontend coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            frontend/coverage/**
  # =============================================================================
  # Build Docker images
  # =============================================================================
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/DEV') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Convert repository name to lowercase
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/backend:latest
            ghcr.io/${{ steps.repo.outputs.name }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/frontend:latest
            ghcr.io/${{ steps.repo.outputs.name }}/frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # Database Backup Job (runs on schedule or manually)
  # =============================================================================
  database-backup:
    name: Database Backup
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/DEV'))

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crypto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crypto"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create backup directory
        run: mkdir -p backups

      - name: Create database backup
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: crypto
        run: |
          DATE=$(date +%Y-%m-%d_%H-%M-%S)
          pg_dump -h $PGHOST -U $PGUSER -d $PGDATABASE | gzip > backups/crypto_backup_${DATE}.sql.gz
          echo "Backup created: backups/crypto_backup_${DATE}.sql.gz"
          ls -lh backups/

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ github.run_id }}
          path: backups/*.sql.gz
          retention-days: 30

  # =============================================================================
  # Kubernetes Deployment (CD) - Using Minikube on GitHub Actions
  # =============================================================================
  deploy-kubernetes:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/DEV')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Minikube
        uses: medyagh/setup-minikube@latest
        with:
          minikube-version: latest
          kubernetes-version: v1.28.0
          driver: docker
          cpus: 2
          memory: 4096

      - name: Enable Minikube addons
        run: |
          minikube addons enable ingress
          minikube addons enable metrics-server

      - name: Configure Docker to use Minikube
        run: eval $(minikube docker-env)

      - name: Build Docker images in Minikube
        run: |
          eval $(minikube docker-env)
          docker build -t crypto_platform-backend:latest ./backend
          docker build -t crypto_platform-frontend:latest ./frontend
          docker images | grep crypto_platform

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.3.0'

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -k k8s/base
          echo "Waiting for resources to be created..."
          sleep 10

      - name: Wait for deployments
        run: |
          echo "Waiting for PostgreSQL..."
          kubectl wait --for=condition=ready pod -l app=postgres -n crypto-platform --timeout=120s || true
          
          echo "Waiting for Redis..."
          kubectl wait --for=condition=ready pod -l app=redis -n crypto-platform --timeout=120s || true
          
          echo "Waiting for Backend..."
          kubectl wait --for=condition=ready pod -l app=backend -n crypto-platform --timeout=180s || true
          
          echo "Waiting for Frontend..."
          kubectl wait --for=condition=ready pod -l app=frontend -n crypto-platform --timeout=180s || true
          
          echo "Waiting for Worker..."
          kubectl wait --for=condition=ready pod -l app=crypto-worker -n crypto-platform --timeout=180s || true

      - name: Verify deployment
        run: |
          echo "=== Pods Status ==="
          kubectl get pods -n crypto-platform
          echo ""
          echo "=== Services Status ==="
          kubectl get svc -n crypto-platform
          echo ""
          echo "=== Ingress Status ==="
          kubectl get ingress -n crypto-platform
          echo ""
          echo "=== Deployment Details ==="
          kubectl describe deployment backend -n crypto-platform | grep -A 5 "Replicas:" || true
          kubectl describe deployment frontend -n crypto-platform | grep -A 5 "Replicas:" || true

      - name: Run smoke tests
        run: |
          echo "Testing backend health..."
          kubectl port-forward svc/backend 3004:3004 -n crypto-platform &
          sleep 5
          curl -f http://localhost:3004/health || echo "Backend health check failed (endpoint may not exist)"
          
          echo "Testing frontend availability..."
          kubectl port-forward svc/frontend 3000:3000 -n crypto-platform &
          sleep 5
          curl -f http://localhost:3000 || echo "Frontend health check failed"

      - name: Show application URL
        if: success()
        run: |
          MINIKUBE_IP=$(minikube ip)
          echo "✅ Deployment successful!"
          echo "📍 Application accessible at: http://$MINIKUBE_IP"
          echo "📝 Add to /etc/hosts: $MINIKUBE_IP crypto-platform.local"

      - name: Deployment summary
        if: always()
        run: |
          echo "=== Final Deployment Status ==="
          kubectl get all -n crypto-platform
          echo ""
          echo "=== Recent Events ==="
          kubectl get events -n crypto-platform --sort-by='.lastTimestamp' | tail -20

      - name: Deploy Monitoring Stack (Prometheus + Grafana)
        run: |
          echo "=== Deploying Monitoring Stack ==="
          kubectl apply -k k8s/monitoring
          echo "Waiting for monitoring resources..."
          sleep 10

      - name: Wait for Monitoring deployments
        run: |
          echo "Waiting for Prometheus..."
          kubectl wait --for=condition=ready pod -l app=prometheus -n monitoring --timeout=120s || true
          
          echo "Waiting for Grafana..."
          kubectl wait --for=condition=ready pod -l app=grafana -n monitoring --timeout=120s || true

      - name: Verify Monitoring deployment
        run: |
          echo "=== Monitoring Pods Status ==="
          kubectl get pods -n monitoring
          echo ""
          echo "=== Monitoring Services Status ==="
          kubectl get svc -n monitoring
          echo ""
          echo "=== Monitoring Ingress Status ==="
          kubectl get ingress -n monitoring || true

      - name: Show Monitoring URLs
        if: success()
        run: |
          MINIKUBE_IP=$(minikube ip)
          echo " Monitoring Stack deployed!"
          echo " Prometheus: http://$MINIKUBE_IP:30090 (or via port-forward)"
          echo " Grafana: http://$MINIKUBE_IP:30030 (or via port-forward)"
          echo ""
          echo "To access locally:"
          echo "  kubectl port-forward svc/prometheus 9090:9090 -n monitoring"
          echo "  kubectl port-forward svc/grafana 3001:3000 -n monitoring"

  # =============================================================================
  # Kubernetes Dry Run (for PRs)
  # =============================================================================
  k8s-dry-run:
    name: Kubernetes Dry Run
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.3.0'

      - name: Validate Kubernetes manifests
        run: |
          echo "=== Validating Kubernetes manifests ==="
          kustomize build k8s/base > /tmp/k8s-manifests.yaml
          
          # Basic YAML validation
          cat /tmp/k8s-manifests.yaml | head -100
          echo ""
          echo "=== Manifest validation successful ==="

      - name: Check for common issues
        run: |
          echo "=== Checking for common issues ==="
          
          # Check if all required files exist
          for file in namespace configmap secrets persistent-volumes postgres redis backend worker frontend ingress kustomization; do
            if [ -f "k8s/base/${file}.yaml" ]; then
              echo "✓ k8s/base/${file}.yaml exists"
            else
              echo "✗ k8s/base/${file}.yaml missing"
              exit 1
            fi
          done
          
          echo ""
          echo "=== All checks passed ==="
