name: CI

on:
  push:
    branches: [DEV]
  pull_request:
    branches: [main]
  schedule:
    # Backup automatique tous les jours à 2h du matin UTC
    - cron: '0 2 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests + coverage)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crypto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crypto_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crypto_test?schema=public
      JWT_SECRET: test_jwt_secret
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install (backend)
        working-directory: backend
        run: npm ci

      - name: Unit tests + coverage (backend)
        working-directory: backend
        env:
          FIREBASE_DISABLED: "true"
        run: npm run test:coverage

      - name: Prepare integration DB schema (backend)
        working-directory: backend
        run: npm run test:integration:prepare

      - name: Integration tests + coverage (backend)
        working-directory: backend
        env:
          FIREBASE_DISABLED: "true"
        run: npm run test:integration:coverage

      - name: Upload backend coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage/**
            backend/coverage-integration/**

  frontend:
    name: Frontend (tests + coverage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (frontend)
        working-directory: frontend
        run: npm ci

      - name: Lint (frontend)
        working-directory: frontend
        run: npm run lint

      - name: Unit tests + coverage (frontend)
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload frontend coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            frontend/coverage/**

  sonarqube:
    name: SonarQube (analysis)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    # SonarQube is optional - runs only if secrets are configured
    # Check is done at step level since secrets aren't accessible at job level

    steps:
      - name: Check if SonarQube is configured
        id: sonar-check
        run: |
          if [ -n "${{ secrets.SONAR_TOKEN }}" ] && [ -n "${{ secrets.SONAR_HOST_URL }}" ] && [ -n "${{ secrets.SONAR_PROJECT_KEY }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo " SonarQube secrets not configured. Skipping analysis."
          fi

      - name: Checkout
        if: steps.sonar-check.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Download coverage artifacts
        if: steps.sonar-check.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Copy coverage files into repo paths
        if: steps.sonar-check.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Backend
          if [ -f artifacts/backend-coverage/backend/coverage/lcov.info ]; then
            mkdir -p backend/coverage
            cp artifacts/backend-coverage/backend/coverage/lcov.info backend/coverage/lcov.info
          fi
          if [ -f artifacts/backend-coverage/backend/coverage-integration/lcov.info ]; then
            mkdir -p backend/coverage-integration
            cp artifacts/backend-coverage/backend/coverage-integration/lcov.info backend/coverage-integration/lcov.info
          fi

          # Frontend
          if [ -f artifacts/frontend-coverage/frontend/coverage/lcov.info ]; then
            mkdir -p frontend/coverage
            cp artifacts/frontend-coverage/frontend/coverage/lcov.info frontend/coverage/lcov.info
          fi

      - name: SonarQube Scan
        if: steps.sonar-check.outputs.configured == 'true'
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.sources=backend/src,frontend/src
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.next/**,**/coverage/**,**/coverage-integration/**
            -Dsonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,backend/coverage-integration/lcov.info,frontend/coverage/lcov.info

  # =============================================================================
  # Build Docker images
  # =============================================================================
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/DEV')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Convert repository name to lowercase
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/backend:latest
            ghcr.io/${{ steps.repo.outputs.name }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/frontend:latest
            ghcr.io/${{ steps.repo.outputs.name }}/frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # Database Backup Job (runs on schedule or manually)
  # =============================================================================
  database-backup:
    name: Database Backup
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crypto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crypto"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create backup directory
        run: mkdir -p backups

      - name: Create database backup
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: crypto
        run: |
          DATE=$(date +%Y-%m-%d_%H-%M-%S)
          pg_dump -h $PGHOST -U $PGUSER -d $PGDATABASE | gzip > backups/crypto_backup_${DATE}.sql.gz
          echo "Backup created: backups/crypto_backup_${DATE}.sql.gz"
          ls -lh backups/

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ github.run_id }}
          path: backups/*.sql.gz
          retention-days: 30

  # =============================================================================
  # Kubernetes Deployment (CD)
  # =============================================================================
  deploy-kubernetes:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/DEV')
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
      - name: Check if Kubernetes is configured
        id: k8s-check
        run: |
          if [ -n "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "✓ KUBE_CONFIG secret is configured"
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo " KUBE_CONFIG secret not configured. Skipping Kubernetes deployment."
            echo "To enable K8s deployment, add KUBE_CONFIG secret with your kubeconfig (base64 encoded)."
          fi

      - name: Checkout
        if: steps.k8s-check.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Convert repository name to lowercase
        if: steps.k8s-check.outputs.configured == 'true'
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Install kubectl
        if: steps.k8s-check.outputs.configured == 'true'
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      - name: Install kustomize
        if: steps.k8s-check.outputs.configured == 'true'
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.3.0'

      - name: Set up kubeconfig
        if: steps.k8s-check.outputs.configured == 'true'
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update image tags with kustomize
        if: steps.k8s-check.outputs.configured == 'true'
        working-directory: k8s/base
        run: |
          # Update backend image (from local name to ghcr.io with commit SHA)
          kustomize edit set image crypto_platform-backend=ghcr.io/${{ steps.repo.outputs.name }}/backend:${{ github.sha }}
          # Update frontend image
          kustomize edit set image crypto_platform-frontend=ghcr.io/${{ steps.repo.outputs.name }}/frontend:${{ github.sha }}
          # Update worker image
          kustomize edit set image crypto_platform-worker=ghcr.io/${{ steps.repo.outputs.name }}/backend:${{ github.sha }}

      - name: Deploy to Kubernetes
        if: steps.k8s-check.outputs.configured == 'true'
        run: |
          kubectl apply -k k8s/base

      - name: Wait for rollout
        if: steps.k8s-check.outputs.configured == 'true'
        run: |
          kubectl rollout status deployment/backend -n crypto-platform --timeout=300s
          kubectl rollout status deployment/frontend -n crypto-platform --timeout=300s
          kubectl rollout status deployment/crypto-worker -n crypto-platform --timeout=300s

      - name: Verify deployment
        if: steps.k8s-check.outputs.configured == 'true'
        run: |
          echo "=== Pods Status ==="
          kubectl get pods -n crypto-platform
          echo ""
          echo "=== Services Status ==="
          kubectl get svc -n crypto-platform
          echo ""
          echo "=== Ingress Status ==="
          kubectl get ingress -n crypto-platform

      - name: Run smoke tests
        if: steps.k8s-check.outputs.configured == 'true'
        run: |
          # Wait for services to be ready
          sleep 30
          
          # Get backend pod and run health check
          BACKEND_POD=$(kubectl get pods -n crypto-platform -l app=backend -o jsonpath='{.items[0].metadata.name}')
          kubectl exec $BACKEND_POD -n crypto-platform -- wget -qO- http://localhost:3004/health || echo "Health check endpoint not available"
          
          echo "Smoke tests completed!"

      - name: Deployment skipped summary
        if: steps.k8s-check.outputs.configured == 'false'
        run: |
          echo "=============================================="
          echo "  Kubernetes deployment was SKIPPED"
          echo "=============================================="
          echo ""
          echo "Docker images were successfully built and pushed to:"
          echo "  - ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/backend:${{ github.sha }}"
          echo "  - ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/frontend:${{ github.sha }}"
          echo ""
          echo "To enable Kubernetes deployment:"
          echo "  1. Get your kubeconfig file"
          echo "  2. Encode it: cat ~/.kube/config | base64 -w0"
          echo "  3. Add it as a GitHub secret named KUBE_CONFIG"
          echo ""
  # =============================================================================
  # Kubernetes Dry Run (for PRs)
  # =============================================================================
  k8s-dry-run:
    name: Kubernetes Dry Run
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.3.0'

      - name: Validate Kubernetes manifests
        run: |
          echo "=== Validating Kubernetes manifests ==="
          kustomize build k8s/base > /tmp/k8s-manifests.yaml
          
          # Basic YAML validation
          cat /tmp/k8s-manifests.yaml | head -100
          echo ""
          echo "=== Manifest validation successful ==="

      - name: Check for common issues
        run: |
          echo "=== Checking for common issues ==="
          
          # Check if all required files exist
          for file in namespace configmap secrets persistent-volumes postgres redis backend worker frontend ingress kustomization; do
            if [ -f "k8s/base/${file}.yaml" ]; then
              echo "✓ k8s/base/${file}.yaml exists"
            else
              echo "✗ k8s/base/${file}.yaml missing"
              exit 1
            fi
          done
          
          echo ""
          echo "=== All checks passed ==="
