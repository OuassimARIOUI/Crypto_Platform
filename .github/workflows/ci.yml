name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Backup automatique tous les jours à 2h du matin UTC
    - cron: '0 2 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests + coverage)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crypto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crypto_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crypto_test?schema=public
      JWT_SECRET: test_jwt_secret
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install (backend)
        working-directory: backend
        run: npm ci

      - name: Unit tests + coverage (backend)
        working-directory: backend
        run: npm run test:coverage

      - name: Prepare integration DB schema (backend)
        working-directory: backend
        run: npm run test:integration:prepare

      - name: Integration tests + coverage (backend)
        working-directory: backend
        run: npm run test:integration:coverage

      - name: Upload backend coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage/**
            backend/coverage-integration/**

  frontend:
    name: Frontend (tests + coverage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (frontend)
        working-directory: frontend
        run: npm ci

      - name: Lint (frontend)
        working-directory: frontend
        run: npm run lint

      - name: Unit tests + coverage (frontend)
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload frontend coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            frontend/coverage/**

  sonarqube:
    name: SonarQube (analysis)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    # Runs only if secrets are configured in the repo settings.
    if: ${{ secrets.SONAR_TOKEN != '' && secrets.SONAR_HOST_URL != '' && secrets.SONAR_PROJECT_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Copy coverage files into repo paths
        shell: bash
        run: |
          set -euo pipefail
          # Backend
          if [ -f artifacts/backend-coverage/backend/coverage/lcov.info ]; then
            mkdir -p backend/coverage
            cp artifacts/backend-coverage/backend/coverage/lcov.info backend/coverage/lcov.info
          fi
          if [ -f artifacts/backend-coverage/backend/coverage-integration/lcov.info ]; then
            mkdir -p backend/coverage-integration
            cp artifacts/backend-coverage/backend/coverage-integration/lcov.info backend/coverage-integration/lcov.info
          fi

          # Frontend
          if [ -f artifacts/frontend-coverage/frontend/coverage/lcov.info ]; then
            mkdir -p frontend/coverage
            cp artifacts/frontend-coverage/frontend/coverage/lcov.info frontend/coverage/lcov.info
          fi

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.sources=backend/src,frontend/src
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.next/**,**/coverage/**,**/coverage-integration/**
            -Dsonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,backend/coverage-integration/lcov.info,frontend/coverage/lcov.info

  # =============================================================================
  # Build Docker images
  # =============================================================================
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # Database Backup Job (runs on schedule or manually)
  # =============================================================================
  database-backup:
    name: Database Backup
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crypto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crypto"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create backup directory
        run: mkdir -p backups

      - name: Create database backup
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: crypto
        run: |
          DATE=$(date +%Y-%m-%d_%H-%M-%S)
          pg_dump -h $PGHOST -U $PGUSER -d $PGDATABASE | gzip > backups/crypto_backup_${DATE}.sql.gz
          echo "Backup created: backups/crypto_backup_${DATE}.sql.gz"
          ls -lh backups/

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ github.run_id }}
          path: backups/*.sql.gz
          retention-days: 30
