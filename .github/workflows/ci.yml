name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Backup automatique tous les jours à 2h du matin UTC
    - cron: '0 2 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests + coverage)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crypto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crypto_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crypto_test?schema=public
      JWT_SECRET: test_jwt_secret
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install (backend)
        working-directory: backend
        run: npm ci

      - name: Create Firebase mock for CI
        working-directory: backend
        run: |
          cat > firebase-service-account.json << 'EOF'
          {
            "type": "service_account",
            "project_id": "crypto-platform-test",
            "private_key_id": "test-key-id",
            "private_key": "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xfn/ygWyF8PbnGy0AHB7MxszR/goLwPBbvbT\nfBlDJOYMHECgPKUiqoDOhDL/3qdKOISBcWGhSqHLdXqQR91LgsK5jJqLEqTv6LE/\n9sNwVvy0pPO3GHQYqsqDRrvLcL9O5msLEz5v3U8f1/5UBt91TQXsmflRxVHtfH7w\nx8j5EYKbZW2w2+DsvWwJL9NIkHtQ8F8jFudMNDKpFVuJLPLCxY4H0qnwAZ+v+Qt6\ngAoMnU6LAuQV8ySC9Z8bVnLdDGbDMphO3JDqCvZqh3SWjEMY3VNlR3/AhRBbPR/H\n7ltJWK2G4YKWD9oLqQB9gHJo3gO9bnKHXoIYqQIDAQABAoIBAAFkIaDE/S3gYH3s\ng4jIxoGdWqCg6e6fH0CwAfmC+HtHEypN9M7LVv7L8G/dJeqGp+CeyD7X4G6QPQTT\ncevYDBRpXvE6E/ZNGFPFQxHPE8n/g8P0U+Qn0q+iWJQ+bg0MVWZJC3YPFSYmEXOJ\nxf+XzKWz4oLD8qEyeQ0zfthFqBvHR/6CXOB9k7n+ZGnj3s/3/8RMj7b/8jx9h3nD\nHimPy3rz/2h7P3MK+P2J1H9UQ3L9HDP0BLH8k3v9h0r+VCr1b9UTp6Y6D0QIaCaP\nLO3i/lQRa3XQs8QnRw8i0QxHQjOA8F7Qf3cPgh4RMaCg3GfkLJCr1xT+A+R7Y8k4\n8w8A+E0CgYEA6VlJlWiMKnEMNd+f3J9QQf8x+vL+klf5kGa0q3N6c9G7w4O+xNqN\n+e5jMtV6lH8Qm0N+x1LNA6H8G8mfCcJH3YmQqLCH4xGATxv/LVsxHrzMxD+D/soO\nvR/lSNzT0mG2j8rXv0FNA/8dULCi0BPqX4EN3j8afDvf9k/x8EwuvncCgYEA5d3A\nkHFVBVlRJd7M5j/6E6BZQKb7d7gRpLLf2WXP6lhXRxYT3P9u5+fqn7E7zhBl/k7P\nxB8WkZzXCw8T6EJ8C8lGXVJxkZX4t8P9V2FI5o6E3f/pn6K5d3ZbqNwmD1Z5f9z6\ny0NF8yq0fv8hN8g7pX9J4bHw2dQo0k0n+U8v0WcCgYBpkVaJCw6z3t7x1sD8IyJM\nhFnBe5mT0nZM8gdIcA3G5H6mhQW6YMXM3N9TQ8j5L8Y5Qf9q5FvDGk9F3qT9HYyq\nPThBWxW/5Lf0w1S0X8QX9g4KY0X+Aw4q7e6VL/w7x5e8a5o+Yf9p1d9k2i7q8Yw4\nGqN+h5F7qCl5Z5t8p9k0AwKBgGSgM/xE3IhM7j/7Lr1xD6G3g5l5B0V7kJOi8B3w\nS8e+F5xO3t8wIz5v8/W2rF8d1P9r+Dx3E5jH3jK7m6f/I6m5w8P6r3E8k5xQ9y8f\nF1e6Z6q0TQ9g3j9r+K7T4v3w5l8P6m9f/B2n1R5d6X8j+D4wZ7k8O9e2c3S5q7G9\nf1xpAoGBAJnL7r6G+p4f7K0eQT9w7W5d8Z9LJCv9T8j5x6r3L0d9E8f3T6pA7k5x\nQ8w2v5d6B3nF8j9e2W7r4K6m5p8P9d3f/I2o8y6X9k5Z3t7Q8g1j+D5xL7r8f6e9\nV2c3R9d8Y7k+B4wS9p1m6f/O5n8P7l2e3X6q9W8j+D5xZ7g8o9e2\n-----END RSA PRIVATE KEY-----\n",
            "client_email": "test@crypto-platform-test.iam.gserviceaccount.com",
            "client_id": "123456789",
            "auth_uri": "https://accounts.google.com/o/oauth2/auth",
            "token_uri": "https://oauth2.googleapis.com/token",
            "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
            "client_x509_cert_url": "https://www.googleapis.com/robot/v1/metadata/x509/test%40crypto-platform-test.iam.gserviceaccount.com"
          }
          EOF
          echo "✓ Firebase mock service account created for CI"

      - name: Unit tests + coverage (backend)
        working-directory: backend
        run: npm run test:coverage

      - name: Prepare integration DB schema (backend)
        working-directory: backend
        run: npm run test:integration:prepare

      - name: Integration tests + coverage (backend)
        working-directory: backend
        run: npm run test:integration:coverage

      - name: Upload backend coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage/**
            backend/coverage-integration/**

  frontend:
    name: Frontend (tests + coverage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (frontend)
        working-directory: frontend
        run: npm ci

      - name: Lint (frontend)
        working-directory: frontend
        run: npm run lint

      - name: Unit tests + coverage (frontend)
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload frontend coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            frontend/coverage/**

  sonarqube:
    name: SonarQube (analysis)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    # SonarQube is optional - runs only if secrets are configured
    # Check is done at step level since secrets aren't accessible at job level

    steps:
      - name: Check if SonarQube is configured
        id: sonar-check
        run: |
          if [ -n "${{ secrets.SONAR_TOKEN }}" ] && [ -n "${{ secrets.SONAR_HOST_URL }}" ] && [ -n "${{ secrets.SONAR_PROJECT_KEY }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo " SonarQube secrets not configured. Skipping analysis."
          fi

      - name: Checkout
        if: steps.sonar-check.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Download coverage artifacts
        if: steps.sonar-check.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Copy coverage files into repo paths
        if: steps.sonar-check.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Backend
          if [ -f artifacts/backend-coverage/backend/coverage/lcov.info ]; then
            mkdir -p backend/coverage
            cp artifacts/backend-coverage/backend/coverage/lcov.info backend/coverage/lcov.info
          fi
          if [ -f artifacts/backend-coverage/backend/coverage-integration/lcov.info ]; then
            mkdir -p backend/coverage-integration
            cp artifacts/backend-coverage/backend/coverage-integration/lcov.info backend/coverage-integration/lcov.info
          fi

          # Frontend
          if [ -f artifacts/frontend-coverage/frontend/coverage/lcov.info ]; then
            mkdir -p frontend/coverage
            cp artifacts/frontend-coverage/frontend/coverage/lcov.info frontend/coverage/lcov.info
          fi

      - name: SonarQube Scan
        if: steps.sonar-check.outputs.configured == 'true'
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.sources=backend/src,frontend/src
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.next/**,**/coverage/**,**/coverage-integration/**
            -Dsonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,backend/coverage-integration/lcov.info,frontend/coverage/lcov.info

  # =============================================================================
  # Build Docker images
  # =============================================================================
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # Database Backup Job (runs on schedule or manually)
  # =============================================================================
  database-backup:
    name: Database Backup
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crypto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crypto"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create backup directory
        run: mkdir -p backups

      - name: Create database backup
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: crypto
        run: |
          DATE=$(date +%Y-%m-%d_%H-%M-%S)
          pg_dump -h $PGHOST -U $PGUSER -d $PGDATABASE | gzip > backups/crypto_backup_${DATE}.sql.gz
          echo "Backup created: backups/crypto_backup_${DATE}.sql.gz"
          ls -lh backups/

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ github.run_id }}
          path: backups/*.sql.gz
          retention-days: 30

  # =============================================================================
  # Kubernetes Deployment (CD)
  # =============================================================================
  deploy-kubernetes:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production  # Requires approval if configured

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.3.0'

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update image tags with kustomize
        working-directory: k8s/base
        run: |
          # Update backend image (from local name to ghcr.io with commit SHA)
          kustomize edit set image crypto_platform-backend=ghcr.io/${{ github.repository_owner }}/crypto-backend:${{ github.sha }}
          # Update frontend image
          kustomize edit set image crypto_platform-frontend=ghcr.io/${{ github.repository_owner }}/crypto-frontend:${{ github.sha }}
          # Update worker image
          kustomize edit set image crypto_platform-worker=ghcr.io/${{ github.repository_owner }}/crypto-backend:${{ github.sha }}

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -k k8s/base

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/backend -n crypto-platform --timeout=300s
          kubectl rollout status deployment/frontend -n crypto-platform --timeout=300s
          kubectl rollout status deployment/crypto-worker -n crypto-platform --timeout=300s

      - name: Verify deployment
        run: |
          echo "=== Pods Status ==="
          kubectl get pods -n crypto-platform
          echo ""
          echo "=== Services Status ==="
          kubectl get svc -n crypto-platform
          echo ""
          echo "=== Ingress Status ==="
          kubectl get ingress -n crypto-platform

      - name: Run smoke tests
        run: |
          # Wait for services to be ready
          sleep 30
          
          # Get backend pod and run health check
          BACKEND_POD=$(kubectl get pods -n crypto-platform -l app=backend -o jsonpath='{.items[0].metadata.name}')
          kubectl exec $BACKEND_POD -n crypto-platform -- wget -qO- http://localhost:3004/health || echo "Health check endpoint not available"
          
          echo "Smoke tests completed!"

  # =============================================================================
  # Kubernetes Dry Run (for PRs)
  # =============================================================================
  k8s-dry-run:
    name: Kubernetes Dry Run
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.3.0'

      - name: Validate Kubernetes manifests
        run: |
          echo "=== Validating Kubernetes manifests ==="
          kustomize build k8s/base > /tmp/k8s-manifests.yaml
          
          # Basic YAML validation
          cat /tmp/k8s-manifests.yaml | head -100
          echo ""
          echo "=== Manifest validation successful ==="

      - name: Check for common issues
        run: |
          echo "=== Checking for common issues ==="
          
          # Check if all required files exist
          for file in namespace configmap secrets persistent-volumes postgres redis backend worker frontend ingress kustomization; do
            if [ -f "k8s/base/${file}.yaml" ]; then
              echo "✓ k8s/base/${file}.yaml exists"
            else
              echo "✗ k8s/base/${file}.yaml missing"
              exit 1
            fi
          done
          
          echo ""
          echo "=== All checks passed ==="
