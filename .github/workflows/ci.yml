name: CI

# Push (toutes les branches) : tests + SonarQube
# Push sur main / DEV       : + images Docker (GHCR) + déploiement de test sur Minikube
# Push sur main              : + nouveaux tags d'images écrits dans Git pour Argo CD (GitOps)
# Lancement manuel sur main  : tests + versioning (tag + GitHub Release)
on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      bump:
        description: "Type de version (semver)"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # =============================================================================
  # 1. Tests
  # =============================================================================
  backend:
    name: Backend (tests + coverage)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crypto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crypto_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crypto_test?schema=public
      JWT_SECRET: test_jwt_secret
      REDIS_URL: redis://localhost:6379
      FIREBASE_DISABLED: "true"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests + coverage
        run: npm run test:coverage

      - name: Integration tests + coverage
        run: |
          npm run test:integration:prepare
          npm run test:integration:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage/**
            backend/coverage-integration/**

  frontend:
    name: Frontend (lint + tests + coverage)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests + coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/**

  # =============================================================================
  # 2. SonarQube Cloud analysis (non-blocking)
  # =============================================================================
  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Never fails the pipeline: scan errors are tolerated, and the Quality Gate is not
    # awaited (no sonar.qualitygate.wait) - its result is only shown in SonarQube Cloud.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: needed for blame and new code detection

      - name: Check SonarQube token
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning::SONAR_TOKEN secret is not set - SonarQube analysis skipped"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download backend coverage
        if: steps.sonar.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend

      - name: Download frontend coverage
        if: steps.sonar.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Make lcov paths relative to the repository root
        if: steps.sonar.outputs.enabled == 'true'
        run: |
          for dir in backend frontend; do
            for report in "$dir"/coverage*/lcov.info; do
              [ -f "$report" ] || continue
              sed -i -E "s#^SF:([^/])#SF:$dir/\1#" "$report"
              echo "$report: $(grep -c '^SF:' "$report") files"
            done
          done

      - name: SonarQube scan
        if: steps.sonar.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # =============================================================================
  # 3. Docker images -> GitHub Container Registry (main / DEV only)
  # =============================================================================
  docker-build:
    name: Docker image (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/DEV')

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        image: [backend, frontend]  # one parallel job per image, built from ./<image>

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (registry paths must be lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.image }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          # Only the frontend image needs the Firebase key at build time
          build-args: ${{ matrix.image == 'frontend' && format('NEXT_PUBLIC_FIREBASE_API_KEY={0}', secrets.NEXT_PUBLIC_FIREBASE_API_KEY) || '' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # =============================================================================
  # 4. Deployment test on a temporary Kubernetes cluster (Minikube)
  #    Runs only after docker-build, so only on main / DEV.
  #    The cluster lives inside the runner and is destroyed when the job ends.
  # =============================================================================
  deploy-kubernetes:
    name: Deploy to Kubernetes (Minikube)
    runs-on: ubuntu-latest
    needs: [docker-build]

    permissions:
      contents: read
      packages: read

    env:
      NAMESPACE: crypto-platform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Minikube
        uses: medyagh/setup-minikube@latest
        with:
          minikube-version: latest
          kubernetes-version: v1.28.0
          driver: docker
          cpus: 2
          memory: 4096

      - name: Enable Minikube addons
        run: |
          minikube addons enable ingress
          minikube addons enable metrics-server

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.3.0'

      # Build once, deploy the same artifact: the cluster pulls the images that
      # docker-build just pushed to GHCR instead of rebuilding them here.
      - name: Point the manifests to the images of this commit
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REGISTRY="ghcr.io/${GITHUB_REPOSITORY,,}"

          kubectl apply -f k8s/base/namespace.yaml
          kubectl create secret docker-registry ghcr-secret -n "$NAMESPACE" \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USER" \
            --docker-password="$GHCR_TOKEN"

          # The worker runs the backend image with another command (see docker-compose.yml)
          cd k8s/base
          kustomize edit set image \
            "crypto_platform-backend=$REGISTRY/backend:$GITHUB_SHA" \
            "crypto_platform-worker=$REGISTRY/backend:$GITHUB_SHA" \
            "crypto_platform-frontend=$REGISTRY/frontend:$GITHUB_SHA"

      - name: Deploy application
        run: |
          kubectl apply -k k8s/base
          # All deployments start in parallel and share a single timeout
          if ! kubectl wait deployment --all -n "$NAMESPACE" --for=condition=Available --timeout=300s; then
            echo "::warning::Some deployments are not ready after 5 minutes (see the diagnostics step)"
          fi
          kubectl get pods,svc -n "$NAMESPACE"

      - name: Smoke tests
        run: |
          check() {  # check <service> <port> <path>
            kubectl port-forward "svc/$1" "$2:$2" -n "$NAMESPACE" > /dev/null 2>&1 &
            local pid=$!
            sleep 5
            if curl -fsS -o /dev/null "http://localhost:$2$3"; then
              echo "OK: $1 answers on $3"
            else
              echo "::warning::Smoke test failed: $1 does not answer on $3"
            fi
            kill "$pid" 2> /dev/null || true
          }
          check backend-service 3004 /health
          check frontend-service 3000 /

      - name: Deploy monitoring stack (Prometheus, Grafana, Loki, Alertmanager)
        run: |
          kubectl apply -k k8s/monitoring
          if ! kubectl wait deployment/prometheus deployment/grafana -n monitoring --for=condition=Available --timeout=120s; then
            echo "::warning::Prometheus / Grafana are not ready after 2 minutes"
          fi
          kubectl get pods,svc -n monitoring

      - name: Diagnostics
        if: always()
        run: |
          kubectl get all -n "$NAMESPACE"
          echo "=== Recent events ==="
          kubectl get events -n "$NAMESPACE" --sort-by='.lastTimestamp' | tail -30
          for deployment in backend crypto-worker frontend; do
            echo "=== Logs: $deployment ==="
            kubectl logs "deployment/$deployment" -n "$NAMESPACE" --all-containers --tail=20 || true
          done

  # =============================================================================
  # 5. GitOps (main only): write the new image tags into Git.
  #    The CI never touches the real cluster: Argo CD (k8s/argocd) watches
  #    k8s/overlays/staging and deploys every change it sees there.
  # =============================================================================
  gitops:
    name: GitOps (image tags for Argo CD)
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the rebase below always works

      # Only the newTag lines change (kustomize edit would rewrite the whole file and drop its comments)
      - name: Point the staging overlay to the images of this commit
        run: |
          sed -i -E "s/^(\s+newTag: ).*/\1$GITHUB_SHA/" k8s/overlays/staging/kustomization.yaml
          git diff

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/staging/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Image tags already up to date"
            exit 0
          fi
          git commit -m "chore(gitops): deploy ${GITHUB_SHA::7} [skip ci]"
          # main may have moved in the meantime (e.g. a release): rebase, then retry
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          exit 1

  # =============================================================================
  # 6. Versioning (manual only): bump version, tag, GitHub Release
  # =============================================================================
  versioning:
    name: Versioning (manual)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags needed to find the last version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          # Last vX.Y.Z tag, or backend/package.json version for the first release
          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [ -n "$LAST_TAG" ]; then
            CURRENT="${LAST_TAG#v}"
          else
            CURRENT=$(node -p "require('./backend/package.json').version")
          fi

          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *) echo "Unknown bump type: $BUMP"; exit 1 ;;
          esac
          NEXT="$MAJOR.$MINOR.$PATCH"

          if git rev-parse -q --verify "refs/tags/v$NEXT" > /dev/null; then
            echo "Tag v$NEXT already exists"
            exit 1
          fi

          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"
          echo "Version: $CURRENT -> $NEXT ($BUMP)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Bump package versions (backend + frontend)
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          for dir in backend frontend; do
            (cd "$dir" && npm version "$NEXT" --no-git-tag-version --allow-same-version)
          done

      - name: Commit, tag and push
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json frontend/package.json frontend/package-lock.json
          git commit -m "chore(release): $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes
