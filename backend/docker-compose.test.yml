services:
  postgres_test:
    image: postgres:16-alpine
    container_name: crypto_platform_postgres_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crypto_test
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crypto_test"]
      interval: 2s
      timeout: 3s
      retries: 30
