# OWASP ZAP Configuration pour Crypto Platform

# Configuration globale
global:
  name: "Crypto Platform Security Scan"
  version: "1.0.0"
  
# Cibles à scanner
targets:
  - url: "http://localhost:3004"
    name: "Backend API"
    
  - url: "http://localhost:3000"
    name: "Frontend"

# URLs à exclure du scan
excludeUrls:
  - "http://localhost:3004/metrics"
  - "http://localhost:3004/health"
  - "http://localhost:3004/api/docs"

# Types de scans à effectuer
scans:
  - type: "baseline"
    enabled: true
    description: "Scan rapide pour détecter les vulnérabilités évidentes"
    
  - type: "full"
    enabled: false
    description: "Scan complet (plus lent mais plus détaillé)"
    
  - type: "api"
    enabled: true
    description: "Scan spécifique pour les endpoints API"
    openapi: "http://localhost:3004/api/docs/json"

# Authentification (si nécessaire)
authentication:
  enabled: false
  type: "bearer"
  # token: "${ZAP_AUTH_TOKEN}" # À définir en variable d'environnement

# Niveau de risque acceptable
acceptedRisk:
  high: 0        # Aucune vulnérabilité High acceptée
  medium: 2      # Maximum 2 Medium acceptées
  low: 5         # Maximum 5 Low acceptées

# Configuration des rapports
reports:
  outputDir: "./reports"
  formats:
    - html
    - json
    - xml
  includePassedTests: false

# Tests actifs
activeScans:
  - "SQL Injection"
  - "Cross Site Scripting (XSS)"
  - "Path Traversal"
  - "Remote File Inclusion"
  - "Server Side Include"
  - "Script Active Scan Rules"
  - "Server Side Code Injection"
  - "Remote OS Command Injection"
  - "External Redirect"
  - "CRLF Injection"
  - "Source Code Disclosure"
  - "Shell Shock"
  - "Remote Code Execution"
  - "LDAP Injection"
  - "XPath Injection"
  - "XML External Entity"
  - "Padding Oracle"
  - "Insecure HTTP Methods"
  - "Parameter Tampering"

# Tests passifs
passiveScans:
  - "Information Disclosure"
  - "Cookie Security"
  - "CSP Scanner"
  - "Application Error Disclosure"
  - "Private IP Disclosure"
  - "Session ID in URL Rewrite"
  - "Timestamp Disclosure"
  - "Hash Disclosure"
  - "Insecure Authentication"
  - "Insecure JSF ViewState"
  - "Charset Mismatch"
  - "Content Security Policy"
  - "Cookie without SameSite Attribute"
  - "Missing Anti-clickjacking Header"
  - "Vulnerable JavaScript Library"

# Timeouts et limites
limits:
  maxScanDurationMinutes: 60
  maxDepth: 5
  maxChildren: 10
  requestsPerSecond: 100

# Proxy settings (si nécessaire)
proxy:
  enabled: false
  # host: "proxy.example.com"
  # port: 8080
