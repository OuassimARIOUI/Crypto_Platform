services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: post1234
      POSTGRES_DB: crypto
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: always

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: always

  backend:
    build: ./backend
    container_name: backend
    env_file:
      - ./backend/.env
    command: ["sh", "-c", "npx prisma db push --accept-data-loss && node index.js"]
    ports:
      - "3004:3004"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  worker:
    build: ./backend
    container_name: worker
    env_file:
      - ./backend/.env
    command: ["sh", "-c", "npx prisma db push --accept-data-loss && node src/workers/crypto.worker.js"]
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY}
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY}
      - NEXT_PUBLIC_API_BASE=http://localhost:3004
      - API_BASE_URL=http://backend:3004
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    restart: always

  # Service de backup automatique de la base de données
  db-backup:
    image: postgres:16
    container_name: db-backup
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: post1234
      PGDATABASE: crypto
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Backup service started..."
        while true; do
          /backup.sh
          echo "Next backup in 24 hours..."
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  pgdata:
  redisdata:
