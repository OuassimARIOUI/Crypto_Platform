<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c22"/>
      <stop offset="1" stop-color="#0b1418"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0da6f2"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="800" rx="28" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g opacity="0.18">
    <path d="M80 120H1120" stroke="#90b7cb" stroke-width="1"/>
    <path d="M80 200H1120" stroke="#90b7cb" stroke-width="1"/>
    <path d="M80 280H1120" stroke="#90b7cb" stroke-width="1"/>
    <path d="M80 360H1120" stroke="#90b7cb" stroke-width="1"/>
    <path d="M80 440H1120" stroke="#90b7cb" stroke-width="1"/>
    <path d="M80 520H1120" stroke="#90b7cb" stroke-width="1"/>
    <path d="M80 600H1120" stroke="#90b7cb" stroke-width="1"/>

    <path d="M160 80V720" stroke="#90b7cb" stroke-width="1"/>
    <path d="M300 80V720" stroke="#90b7cb" stroke-width="1"/>
    <path d="M440 80V720" stroke="#90b7cb" stroke-width="1"/>
    <path d="M580 80V720" stroke="#90b7cb" stroke-width="1"/>
    <path d="M720 80V720" stroke="#90b7cb" stroke-width="1"/>
    <path d="M860 80V720" stroke="#90b7cb" stroke-width="1"/>
    <path d="M1000 80V720" stroke="#90b7cb" stroke-width="1"/>
  </g>

  <!-- card frame -->
  <rect x="110" y="110" width="980" height="580" rx="22" fill="rgba(255,255,255,0.03)" stroke="rgba(49,86,104,0.45)"/>

  <!-- line chart -->
  <path d="M150 600C220 560 250 520 310 520C380 520 410 610 480 560C560 500 600 430 670 450C740 470 770 390 840 350C910 310 960 380 1030 320" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>

  <!-- glow points -->
  <g filter="url(#shadow)">
    <circle cx="150" cy="600" r="7" fill="#0da6f2"/>
    <circle cx="310" cy="520" r="7" fill="#0da6f2"/>
    <circle cx="480" cy="560" r="7" fill="#0da6f2"/>
    <circle cx="670" cy="450" r="7" fill="#0da6f2"/>
    <circle cx="840" cy="350" r="7" fill="#0da6f2"/>
    <circle cx="1030" cy="320" r="7" fill="#0da6f2"/>
  </g>

  <!-- candlesticks -->
  <g opacity="0.95">
    <g>
      <line x1="240" y1="360" x2="240" y2="470" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
      <rect x="230" y="395" width="20" height="45" rx="4" fill="rgba(52,211,153,0.22)" stroke="#34d399"/>
    </g>
    <g>
      <line x1="360" y1="300" x2="360" y2="450" stroke="#f87171" stroke-width="4" stroke-linecap="round"/>
      <rect x="350" y="330" width="20" height="70" rx="4" fill="rgba(248,113,113,0.18)" stroke="#f87171"/>
    </g>
    <g>
      <line x1="520" y1="260" x2="520" y2="430" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
      <rect x="510" y="310" width="20" height="60" rx="4" fill="rgba(52,211,153,0.22)" stroke="#34d399"/>
    </g>
    <g>
      <line x1="740" y1="240" x2="740" y2="410" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
      <rect x="730" y="290" width="20" height="70" rx="4" fill="rgba(52,211,153,0.22)" stroke="#34d399"/>
    </g>
    <g>
      <line x1="920" y1="210" x2="920" y2="390" stroke="#f87171" stroke-width="4" stroke-linecap="round"/>
      <rect x="910" y="255" width="20" height="85" rx="4" fill="rgba(248,113,113,0.18)" stroke="#f87171"/>
    </g>
  </g>

  <!-- badge -->
  <g>
    <rect x="150" y="150" width="220" height="44" rx="12" fill="rgba(13,166,242,0.12)" stroke="rgba(13,166,242,0.28)"/>
    <text x="170" y="179" fill="#cfefff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Live Market Snapshot</text>
  </g>
</svg>
