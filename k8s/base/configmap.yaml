apiVersion: v1
kind: ConfigMap
metadata:
  name: crypto-config
  namespace: crypto-platform
  labels:
    app.kubernetes.io/name: crypto-platform
data:
  # Database configuration
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "crypto"
  
  # Redis configuration
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  
  # API configuration
  NODE_ENV: "production"
  PORT: "3004"
  
  # Frontend configuration
  NEXT_PUBLIC_API_BASE: "http://backend-service:3004"
  API_BASE_URL: "http://backend-service:3004"

# variables d'environnement pour la configuration de l'application Crypto Platform dans Kubernetes