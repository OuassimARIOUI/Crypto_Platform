apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: crypto-platform

namespace: crypto-platform


commonLabels:
  app.kubernetes.io/name: crypto-platform
  app.kubernetes.io/version: "1.0.0"
  app.kubernetes.io/managed-by: kustomize

# Resources to include wich are sorted by order of application
resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - persistent-volumes.yaml
  - postgres.yaml
  - redis.yaml
  - backend.yaml
  - worker.yaml
  - frontend.yaml
  - ingress.yaml

# Images - Update  for  registry (ghcr.io, dockerhub, etc.)
# For local development with minikube, using local image names
images:
  - name: crypto_platform-backend
    newTag: latest
  - name: crypto_platform-frontend
    newTag: latest
  - name: crypto_platform-worker
    newTag: latest
