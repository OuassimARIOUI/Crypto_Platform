apiVersion: v1
kind: Secret
metadata:
  name: crypto-secrets
  namespace: crypto-platform
  labels:
    app.kubernetes.io/name: crypto-platform
type: Opaque
stringData:
  # Database credentials (should be changed in production!)
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "post1234"
  
  # Database URL for Prisma
  DATABASE_URL: "postgresql://postgres:post1234@postgres-service:5432/crypto?schema=public"
  
  # Redis URL
  REDIS_URL: "redis://redis-service:6379"
  
  # JWT Secret (generate a strong one for production!)
  JWT_SECRET: "your-super-secret-jwt-key-change-in-production"
  
  # Firebase credentials (add your actual credentials)
  # FIREBASE_API_KEY: ""
  # FIREBASE_PROJECT_ID: ""
---
# Separate secret for Firebase service account (if needed)
apiVersion: v1
kind: Secret
metadata:
  name: firebase-credentials
  namespace: crypto-platform
type: Opaque
data:
  # Base64 encoded firebase-service-account.json content
  # Use: cat firebase-service-account.json | base64 -w 0
  firebase-service-account.json: ""
