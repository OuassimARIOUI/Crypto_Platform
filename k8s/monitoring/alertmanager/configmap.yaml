# Configuration d'Alertmanager
# Les alertes sont groupees et envoyees selon les regles definies
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app: alertmanager
data:
  alertmanager.yml: |
    global:
      # Temps d'attente avant de resoudre une alerte
      resolve_timeout: 5m

    # Route principale des alertes
    route:
      # Grouper les alertes par nom et severite
      group_by: ['alertname', 'severity']
      # Attendre 30 secondes avant d'envoyer la premiere notification
      group_wait: 30s
      # Attendre 5 minutes entre chaque notification du meme groupe
      group_interval: 5m
      # Repeter les alertes toutes les 4 heures
      repeat_interval: 4h
      # Envoyer vers le receiver par defaut
      receiver: 'default-receiver'
      
      # Routes specifiques selon la severite
      routes:
        - match:
            severity: critical
          receiver: 'critical-receiver'
          group_wait: 10s
          repeat_interval: 1h
        - match:
            severity: warning
          receiver: 'warning-receiver'
          repeat_interval: 2h

    # Recepteurs des alertes
    receivers:
      # Receiver par defaut - affiche dans les logs
      - name: 'default-receiver'
        email_configs:
          - to: 'u4820065201@gmail.com'
            from: 'crypto-platform-alerts@gmail.com'
            smarthost: 'smtp.gmail.com:587'
            auth_username: 'crypto-platform-alerts@gmail.com'
            auth_identity: 'crypto-platform-alerts@gmail.com'
            auth_password: 'ldnu kxmf njxb jixf'
            headers:
              Subject: '[Crypto Platform] Alerte'
            send_resolved: true

      # Receiver pour alertes critiques - URGENT
      - name: 'critical-receiver'
        email_configs:
          - to: 'u4820065201@gmail.com'
            from: 'crypto-platform-alerts@gmail.com'
            smarthost: 'smtp.gmail.com:587'
            auth_username: 'crypto-platform-alerts@gmail.com'
            auth_identity: 'crypto-platform-alerts@gmail.com'
            auth_password: 'ldnu kxmf njxb jixf'
            headers:
              Subject: '[CRITIQUE] Crypto Platform - Alerte Urgente'
            text: |
              ALERTE CRITIQUE!
              
              {{ range .Alerts }}
              Alerte: {{ .Labels.alertname }}
              Severite: {{ .Labels.severity }}
              Description: {{ .Annotations.description }}
              Debut: {{ .StartsAt }}
              {{ end }}
            send_resolved: true

      # Receiver pour alertes warning
      - name: 'warning-receiver'
        email_configs:
          - to: 'u4820065201@gmail.com'
            from: 'crypto-platform-alerts@gmail.com'
            smarthost: 'smtp.gmail.com:587'
            auth_username: 'crypto-platform-alerts@gmail.com'
            auth_identity: 'crypto-platform-alerts@gmail.com'
            auth_password: 'YOUR_APP_PASSWORD_HERE'
            headers:
              Subject: '[WARNING] Crypto Platform - Alerte'
            send_resolved: true

    # Regles d'inhibition
    # Permet de supprimer certaines alertes quand d'autres sont actives
    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'namespace']
