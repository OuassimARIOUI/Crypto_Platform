apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: crypto-platform

resources:
  - ../../base

# Labels communs pour staging
commonLabels:
  environment: staging

# Patch pour réduire les ressources en staging
patches:
  # Réduire les replicas backend
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "250m"

  # Réduire les replicas frontend
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"

  # Réduire HPA backend
  - target:
      kind: HorizontalPodAutoscaler
      name: backend-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2

  # Réduire HPA frontend
  - target:
      kind: HorizontalPodAutoscaler
      name: frontend-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2

  # Réduire le stockage PostgreSQL
  - target:
      kind: PersistentVolumeClaim
      name: postgres-pvc
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: "5Gi"

# ConfigMap pour staging
configMapGenerator:
  - name: crypto-config
    behavior: merge
    literals:
      - NODE_ENV=staging
      - LOG_LEVEL=debug

# Images avec tag staging
images:
  - name: crypto_platform-backend
    newTag: staging
  - name: crypto_platform-frontend
    newTag: staging
  - name: crypto_platform-worker
    newTag: staging
