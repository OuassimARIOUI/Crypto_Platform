# SonarQube Cloud - CI-based analysis (job "sonarqube" in .github/workflows/ci.yml)
sonar.projectKey=OuassimARIOUI_Crypto_Platform
sonar.organization=ouassimarioui
sonar.projectName=Crypto_Platform

sonar.sourceEncoding=UTF-8

# Whole repository is analysed; test files are declared as tests (not as sources)
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=backend/src/test/**,**/__tests__/**,**/*.test.*,**/*.spec.*,frontend/vitest.setup.js

# Generated / vendored content + the test files listed above (a file cannot be both source and test)
sonar.exclusions=**/node_modules/**,**/coverage/**,**/coverage-integration/**,**/.next/**,backups/**,redis-data/**,backend/src/test/**,**/__tests__/**,**/*.test.*,**/*.spec.*,frontend/vitest.setup.js

# Coverage reports produced by the "backend" and "frontend" jobs
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,backend/coverage-integration/lcov.info,frontend/coverage/lcov.info
